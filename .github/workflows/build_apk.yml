name: Build VictusCloud Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env
        working-directory: victus_app
        run: |
          cat << 'EOF' > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://db.victuscloud.com' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqdWl5d2R1amlucmtrcG9icHF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM3ODYyNDMsImV4cCI6MjA3OTM2MjI0M30.Vghl_PKcGwqudXq-fnk-6IuX16NM-PHtngU4aL9cxcc' }}
          PTERODACTYL_URL=${{ secrets.PTERODACTYL_URL || 'https://control.victuscloud.com' }}
          PAYMENTER_URL=${{ secrets.PAYMENTER_URL || 'https://billing.victuscloud.com' }}
          FCM_SENDER_ID=${{ secrets.FCM_SENDER_ID || '1234567890' }}
          EOF

      - name: Configure Android local.properties
        working-directory: victus_app
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install dependencies
        working-directory: victus_app
        run: flutter pub get

      - name: Run code generation (build_runner)
        working-directory: victus_app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        working-directory: victus_app
        run: |
          flutter build apk --release --no-tree-shake-icons --verbose 2>&1 | tee ../build_output.log

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Diagnostics-Log
          path: build_output.log

      - name: Locate and Collect APKs
        run: |
          mkdir -p release_apk
          cp victus_app/build/app/outputs/flutter-apk/app-release.apk release_apk/VictusCloud-Release.apk
          ls -la release_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VictusCloud-Release-APK
          path: release_apk/VictusCloud-Release.apk

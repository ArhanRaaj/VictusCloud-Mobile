name: victus_app
description: A new Flutter project for VictusCloud.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  go_router: ^13.2.0
  supabase_flutter: ^2.4.0
  dio: ^5.4.2
  flutter_secure_storage: ^9.0.0

  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2
  image_picker: ^1.0.7
  file_picker: ^6.1.1
